[package]
name = "zellij-server"
version.workspace = true
authors = ["Kunal Mohan <kunalmohan99@gmail.com>"]
edition.workspace = true
description = "The server-side library for Zellij"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ansi_term = { workspace = true }
anyhow = { workspace = true }
arrayvec = { version = "0.7.2", default-features = false, features = ["std"] }
async-trait = { version = "0.1.50", default-features = false }
base64 = { version = "0.13.0", default-features = false, features = ["std"] }
byteorder = { version = "1.4.3", default-features = false, features = ["std"] }
bytes = { version = "1.6.0", default-features = false, features = ["std"] }
cassowary = { version = "0.3.0", default-features = false }
chrono = { version = "0.4.19", default-features = false, features = ["std", "clock"] }
crossbeam = { version = "0.8", default-features = false, features = ["crossbeam-channel", "std"] }
highway = { version = "0.6.4", default-features = false, features = ["std"] }
interprocess = { workspace = true }
isahc = { workspace = true }
kdl = { workspace = true }
lazy_static = { workspace = true }
log = { workspace = true }
miniz_oxide = "0.8"
notify-debouncer-full = { workspace = true }
prost = { workspace = true }
regex = { workspace = true }
semver = { version = "0.11.0", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sixel-image = { version = "0.2.1", default-features = false }
sixel-tokenizer = { version = "0.1.0", default-features = false }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tempfile = { workspace = true }
tokio = { workspace = true }
typetag = { version = "0.1.7", default-features = false }
unicode-width = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
vte = { workspace = true }
wasmi_wasi = { version = "0.51.3" }
zellij-utils = { workspace = true }
zellij-tile = { workspace = true, optional = true }
status-bar = { path = "../default-plugins/status-bar", optional = true }
tab-bar = { path = "../default-plugins/tab-bar", optional = true }
tabs-controller = { path = "../../zellij-scratch.native-tabs/crates/tabs-controller", optional = true }
tabs-rail = { path = "../../zellij-scratch.native-tabs/crates/tabs-rail", optional = true }
tabs-rail-config = { path = "../../zellij-scratch.native-tabs/crates/tabs-rail-config", optional = true }
once_cell = "1.19"
num_cpus = { workspace = true }

[dependencies.wasmi]
version = "0.51.3"
default-features = false
features = ["std"]

[target.'cfg(unix)'.dependencies]
close_fds = "0.3.2"
daemonize = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
signal-hook = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
insta = "1.6.0"
tempfile = "3.2.0"
wasmi = { version = "0.51.3", features = ["std"] }

[features]
web_server_capability = ["zellij-utils/web_server_capability"]
# Enable native (Rust-linked) plugins alongside the WASM plugin runtime.
# Pulls in the zellij-tile crate so the server can hold `Box<dyn ZellijPlugin>`
# instances. With this off, the `RunPluginLocation::Native(_)` variant still
# parses (for forward-compat) but loading one returns an error at load time.
native-plugins = ["dep:zellij-tile"]
native-status-bar = ["native-plugins", "dep:status-bar"]
native-tab-bar = ["native-plugins", "dep:tab-bar"]
native-tabs-controller = ["native-plugins", "dep:tabs-controller"]
native-tabs-rail = ["native-plugins", "dep:tabs-rail"]
native-tabs-rail-config = ["native-plugins", "dep:tabs-rail-config"]
# All zellij-scratch / ardamento tabs plugins as natives — for profiling.
native-tabs-all = ["native-tabs-controller", "native-tabs-rail", "native-tabs-rail-config"]
# Convenience feature: enables every per-plugin native port available in this
# build. Grows as plugins get ported.
native-plugins-all = ["native-status-bar", "native-tab-bar"]
